# دليل مُجتمعي (dalil.mogtama3y.com) on the VPS, next to n8n.
# Lives in /docker/mogtama3y-dalil/ like the other sites; Traefik (in the
# n8n stack) routes the host name and gets the TLS certificate.
#   docker compose up -d
services:
  web:
    build: .
    image: mogtama3y-dalil:latest
    container_name: mogtama3y-dalil
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      # Report videos uploaded by users (served at /media/v/...).
      - ./media:/app/media
    environment:
      SUPABASE_URL: https://pxiabifybakbsqlycffc.supabase.co
      # Publishable key (public, same one the web app ships) — read-only data.
      SUPABASE_KEY: ${SUPABASE_KEY}
      SITE: https://dalil.mogtama3y.com
      PORT: "8080"
    mem_limit: 512m
    cpus: 0.5
    networks: [n8n_default]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dalil-web.entrypoints=web,websecure
      - traefik.http.routers.dalil-web.rule=Host(`dalil.mogtama3y.com`)
      - traefik.http.routers.dalil-web.tls=true
      - traefik.http.routers.dalil-web.tls.certresolver=mytlschallenge
      - traefik.http.services.dalil-web.loadbalancer.server.port=8080

networks:
  n8n_default:
    external: true
