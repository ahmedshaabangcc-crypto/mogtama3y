name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ITTIHAD_ENABLED: ${{ secrets.ITTIHAD_DEPLOY_KEY != '' }}
      TAJER_ENABLED: ${{ secrets.TAJER_DEPLOY_KEY != '' }}
      # Compiled into main.dart.js only by a local DEMO build (see
      # lib/core/demo/demo_mode.dart) — a deployed build must never have it.
      DEMO_MARKER: MOGTAMA3Y_DEMO_BUILD_9F27C1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The local-only demo mode (no login, fake in-memory backend) is
      # switched on by a compile-time define. No build command in this
      # workflow may ever pass it.
      - name: Guard — no demo build in this workflow
        run: |
          if grep -nE 'flutter[[:space:]]+build' .github/workflows/deploy.yml | grep -iE 'demo'; then
            echo "::error::A web build command in deploy.yml enables the local-only demo mode."
            exit 1
          fi

      # Every migration applied to a throwaway Postgres + the security
      # scenarios (backend/tests/run.js). A failure here stops the deploy.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Database security tests
        working-directory: backend/tests
        run: |
          npm ci
          npm test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget tests
        run: flutter test

      - name: Build web release
        run: |
          flutter build web --release --base-href /
          if grep -q "$DEMO_MARKER" build/web/main.dart.js; then echo "::error::demo build detected"; exit 1; fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: mogtama3y.com

      # The owners'-union app: same code, APP_FLAVOR=ittihad, published to
      # its own repo's GitHub Pages at ittihad.mogtama3y.com. Skipped until
      # the ITTIHAD_DEPLOY_KEY secret (write deploy key of that repo) exists.
      - name: Build union app (ittihad)
        if: env.ITTIHAD_ENABLED == 'true'
        run: |
          flutter build web --release --base-href / --dart-define=APP_FLAVOR=ittihad -o build/web_ittihad
          if grep -q "$DEMO_MARKER" build/web_ittihad/main.dart.js; then echo "::error::demo build detected"; exit 1; fi
          sed -i 's|<title>[^<]*</title>|<title>اتحاد الملاك أونلاين</title>|' build/web_ittihad/index.html
          sed -i 's|<div class="name">[^<]*</div>|<div class="name">اتحاد الملاك</div>|' build/web_ittihad/index.html
          sed -i -E 's#(<meta (name="(description|twitter:description)"|property="og:description") content=")[^"]*#\1اتحاد ملاك عمارتك من الموبايل: المستحقات والقرارات والانتخابات والتقارير المالية والطوارئ وتصاريح الزوار.#; s#(<meta (name="twitter:title"|property="og:title") content=")[^"]*#\1اتحاد الملاك أونلاين#; s#(<meta property="og:url" content=")[^"]*#\1https://ittihad.mogtama3y.com/#' build/web_ittihad/index.html
          sed -i 's|"name": *"[^"]*"|"name": "اتحاد الملاك أونلاين"|; s|"short_name": *"[^"]*"|"short_name": "اتحاد الملاك"|' build/web_ittihad/manifest.json
          # No merchant store pages on the union site; its own sitemap/robots.
          sed -i '/store-lite.js/d' build/web_ittihad/index.html
          rm -f build/web_ittihad/store-lite.js
          # Its own icon (gold building) for the tab, home screen and install.
          cp build/web_ittihad/ittihad_icons/favicon.png build/web_ittihad/favicon.png
          cp build/web_ittihad/ittihad_icons/Icon-*.png build/web_ittihad/icons/
          sed -i 's#https://mogtama3y.com/#https://ittihad.mogtama3y.com/#g' build/web_ittihad/robots.txt
          # Its own canonical (was mogtama3y.com, so Google treated it as a copy)
          # and a sitemap of just its landing — the static pages copied from
          # web/ (privacy, tajer, …) canonicalise to mogtama3y.com.
          sed -i 's#<link rel="canonical" href="[^"]*">#<link rel="canonical" href="https://ittihad.mogtama3y.com/">#' build/web_ittihad/index.html
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://ittihad.mogtama3y.com/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(date -u +%F)" > build/web_ittihad/sitemap.xml

      - name: Deploy union app
        if: env.ITTIHAD_ENABLED == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ITTIHAD_DEPLOY_KEY }}
          external_repository: ahmedshaabangcc-crypto/ittihad
          publish_branch: gh-pages
          publish_dir: ./build/web_ittihad
          cname: ittihad.mogtama3y.com

      # The merchant app "متجري": APP_FLAVOR=tajer, published to its own
      # repo's GitHub Pages at tajer.mogtama3y.com and installable on the
      # phone. Skipped until the TAJER_DEPLOY_KEY secret exists.
      - name: Build merchant app (tajer)
        if: env.TAJER_ENABLED == 'true'
        run: |
          flutter build web --release --base-href / --dart-define=APP_FLAVOR=tajer -o build/web_tajer
          if grep -q "$DEMO_MARKER" build/web_tajer/main.dart.js; then echo "::error::demo build detected"; exit 1; fi
          f=build/web_tajer/index.html
          sed -i 's|<title>[^<]*</title>|<title>متجري — محلك أونلاين ببلاش</title>|' $f
          sed -i 's|<div class="name">[^<]*</div>|<div class="name">متجري</div>|' $f
          sed -i -E 's#(<meta (name="(description|twitter:description)"|property="og:description") content=")[^"]*#\1متجر باسم محلك، ومنتجاتك بالصور والأسعار، والطلبات توصلك على لوحة محلك، والزبون يقدر يبعتهالك واتساب — ببلاش ومن غير عمولة.#; s#(<meta (name="twitter:title"|property="og:title") content=")[^"]*#\1متجري — محلك أونلاين ببلاش#; s#(<meta property="og:url" content=")[^"]*#\1https://tajer.mogtama3y.com/#; s#(<meta name="apple-mobile-web-app-title" content=")[^"]*#\1متجري#' $f
          sed -i 's|"name": *"[^"]*"|"name": "متجري — مُجتمعي"|; s|"short_name": *"[^"]*"|"short_name": "متجري"|; s|"description": *"[^"]*"|"description": "لوحة التاجر: متجرك أونلاين، منتجاتك وطلباتك."|' build/web_tajer/manifest.json
          # Its own sitemap/robots (search engines index the merchant landing).
          sed -i 's#https://mogtama3y.com/#https://tajer.mogtama3y.com/#g' build/web_tajer/robots.txt
          sed -i 's#<link rel="canonical" href="[^"]*">#<link rel="canonical" href="https://tajer.mogtama3y.com/">#' $f
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://tajer.mogtama3y.com/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(date -u +%F)" > build/web_tajer/sitemap.xml
          # Its own icon (gold bag) for the tab, home screen and install.
          cp build/web_tajer/tajer_icons/favicon.png build/web_tajer/favicon.png
          cp build/web_tajer/tajer_icons/Icon-*.png build/web_tajer/icons/

      # Each deploy_key step starts its own ssh-agent on the same socket;
      # clear the union deploy's agent first.
      - name: Reset ssh-agent
        if: env.TAJER_ENABLED == 'true'
        run: |
          pkill ssh-agent || true
          rm -f /tmp/ssh-auth.sock

      - name: Deploy merchant app
        if: env.TAJER_ENABLED == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.TAJER_DEPLOY_KEY }}
          external_repository: ahmedshaabangcc-crypto/tajer
          publish_branch: gh-pages
          publish_dir: ./build/web_tajer
          cname: tajer.mogtama3y.com
