name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every migration applied to a throwaway Postgres + the security
      # scenarios (backend/tests/run.js). A failure here stops the deploy.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Database security tests
        working-directory: backend/tests
        run: |
          npm ci
          npm test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build web release
        run: flutter build web --release --base-href / --source-maps

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: mogtama3y.com
